name: Deploy Fail Raw Materials
on:
  push:
    branches:
      - master
concurrency:
  group: fail-raw-materials-deploy
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: self-hosted
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Show lint information
        run: |
          echo "===== Lint Fail Raw Materials ====="
          echo "Branch : ${{ github.ref_name }}"
          echo "Commit : ${{ github.sha }}"
          echo "Node   : $(node -v)"
          echo "NPM    : $(npm -v)"
          echo "Time   : $(date)"
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Run ESLint
        run: |
          npm run lint
  deploy:
    name: Deploy
    needs: lint
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
        working-directory: /home/it/fail-raw-materials
    steps:
      - name: Show deployment information
        run: |
          echo "===== Deploy Fail Raw Materials ====="
          echo "Branch : ${{ github.ref_name }}"
          echo "Commit : ${{ github.sha }}"
          echo "Time   : $(date)"
      - name: Check production repository
        run: |
          if [ ! -d .git ]; then
            echo "ERROR: /home/it/fail-raw-materials is not a Git repository"
            exit 1
          fi
      - name: Save current commit
        id: current
        run: |
          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "Current commit: $CURRENT_COMMIT"
          echo "commit=$CURRENT_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Update source
        run: |
          git fetch origin master
          git reset --hard origin/master
          git clean -fd
      - name: Install production dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --omit=dev
          else
            npm install --omit=dev
          fi
      - name: Restart PM2
        run: |
          pm2 restart fail-raw-materials
      - name: Wait for application
        run: |
          echo "Waiting for application..."
          for i in {1..10}; do
            if curl -fsS http://127.0.0.1:4003/ > /dev/null; then
              echo "Application is running."
              exit 0
            fi
            echo "Attempt $i/10 failed. Waiting..."
            sleep 2
          done
          echo "ERROR: Application did not respond on port 4003."
          exit 1
      - name: Verify PM2
        run: |
          pm2 status
          pm2 describe fail-raw-materials
      - name: Deployment completed
        run: |
          echo "======================================"
          echo " Deployment successful"
          echo "======================================"
          echo "Application : fail-raw-materials"
          echo "Port        : 4003"
          echo "Commit      : $(git rev-parse HEAD)"
          echo "Time        : $(date)"
